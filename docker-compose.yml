# SkyWatch Australia — Oracle Cloud / any VPS
# Build + run on the VM (native ARM Ampere or AMD micro).
services:
  skywatch-ai:
    build:
      context: ./skywatch-ai
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SKYWATCH_AI_CHECKPOINT: /app/checkpoints/v1-etl.pt
      SKYWATCH_AI_API_KEY: ${SKYWATCH_AI_API_KEY:-}
      PORT: "43137"
    expose:
      - "43137"
    # Optional host access for local Next.js (`SKYWATCH_AI_URL=http://127.0.0.1:43137`)
    ports:
      - "43137:43137"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:43137/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      SKYWATCH_AI_URL: http://skywatch-ai:43137
    # Not published publicly — Caddy proxies to this service.
    expose:
      - "3000"
    depends_on:
      skywatch-ai:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Leave empty for IP-only HTTP on :80. Set to your domain for auto HTTPS.
      SKYWATCH_DOMAIN: ${SKYWATCH_DOMAIN:-}
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
